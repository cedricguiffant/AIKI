name: kana_srs
description: "Kana SRS - Japonais Fluide. Apprenez le japonais via spaced repetition avec import Anki."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # SQLite (for reading .anki2 files inside .apkg)
  sqflite: ^2.3.3

  # File picking & archive
  file_picker: 8.1.2
  archive: ^3.6.1

  # AI - Gemini
  google_generative_ai: ^0.4.6

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Utilities
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.19.0
  uuid: ^4.4.2
  collection: ^1.18.0

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/l10n/
